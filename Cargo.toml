[package]
name = "the-mass"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
	"3d_bevy_render",
	"default_app",
	"default_platform",
	"ui_api",
	"ui_bevy_render",
] }
rand = "0.9"
tracing = { version = "0.1", features = [
	"max_level_debug",
	"release_max_level_warn",
] }
jamtil = { git = "https://github.com/void-scape/jamtil" }
bevy_seedling = "0.7"
# bevy_pretty_text = "0.4"
# bevy_asset_loader = "0.25"
# bevy_rand = { version = "0.14", features = ["chacha20", "wyrand"] }

[features]
default = ["dev_native"]
dev_native = ["dev", "bevy/file_watcher", "bevy/embedded_watcher"]
dev = [
	"bevy/dynamic_linking",
	"bevy/bevy_dev_tools",
	"bevy/bevy_ui_debug",
	"bevy/track_location",
	"bevy/debug",
]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"

[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.bevy_cli.web]
default-features = false

[package.metadata.bevy_cli.web.dev]
features = ["dev"]

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
